<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Interactive TCG Showcase (Hover Fixed)</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Orbitron&display=swap" rel="stylesheet">
    <style>
        body { background-color: #1a202c; font-family: sans-serif; padding: 2rem; }
        h1 { color: #e2e8f0; width: 100%; text-align: center; margin-bottom: 2rem; }
        #card-display-area { display: flex; gap: 2rem; flex-wrap: wrap; align-items: flex-start; justify-content: center; }
        
        .card-wrapper {
            perspective: 1500px;
        }
        .card-container {
            position: relative; width: 250px; height: 350px; cursor: pointer;
            transform-style: preserve-3d;
            /* Apply hover transform here */
            transform: rotateY(var(--rotateY, 0deg)) rotateX(var(--rotateX, 0deg));
            transition: transform 0.4s ease;
        }
        .card-flipper {
            width: 100%; height: 100%;
            transform-style: preserve-3d;
            transition: transform 0.6s ease;
        }
        .card-container.is-flipped .card-flipper {
            transform: rotateY(180deg);
        }
        
        .card-face, .card-back {
            position: absolute; width: 100%; height: 100%;
            -webkit-backface-visibility: hidden; backface-visibility: hidden;
            border-radius: 12.5px; overflow: hidden;
        }
        .card-back {
            transform: rotateY(180deg); background-color: #000;
            background-size: cover; background-position: center;
        }

        .card-art { position: absolute; z-index: 1; background-size: cover; background-position: center; border-radius: 9px; }
        .texture-container { position: absolute; top:0;left:0;width:100%;height:100%; z-index: 2; pointer-events: none; border-radius: inherit; overflow: hidden; }
        .texture-container::before, .texture-container::after { content:'';position:absolute;left:0;top:0;width:100%;height:100%; }
        .card-text-overlay { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 2; }
        .card-frame { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 3; pointer-events: none; }
        
        .card-name-box, .card-number-box, .rarity-stars-container {
            position: absolute; display: flex; align-items: center; text-align: center; color: white;
            box-sizing: border-box; text-shadow: 1px 1px 2px rgba(0,0,0,0.9);
        }
        .card-name-box { font-family: 'Bebas Neue', sans-serif; font-size: 2.1rem; justify-content: center; font-weight: bold; color: #d1faff; text-shadow: 0 0 2px #fff, 0 0 8px #00c2ff, 0 0 12px #00c2ff; }
        .card-name-box > span { position: relative; overflow: hidden; display: inline-block; }
        .card-name-box > span::before { content:'';position:absolute;top:0;left:-100%;width:50%;height:100%;background:linear-gradient(90deg, transparent, #fff, transparent);filter:blur(2px);animation:text-shimmer 4s ease-in-out infinite;}
        .card-number-box { font-family: 'Orbitron', sans-serif; font-size: 0.8rem; justify-content: center; white-space: nowrap; }
        .rarity-stars-container { justify-content: center; }
        .star-wrapper:not(:first-child) { margin-left: -10px; }
        .star { width: 16px; height: 16px; stroke: #1a202c; stroke-width: 1px; filter: drop-shadow(0 0 1px rgba(0,0,0,0.7)); }
        .star.rainbow { fill: #FFD700; animation: rainbowStar 3s linear infinite; }
        .star.rainbow:nth-child(n+2){animation-delay:-0.6s}
        
        @keyframes rainbowStar { 0%,100%{filter:hue-rotate(0deg)} 50%{filter:hue-rotate(360deg)} }
        @keyframes text-shimmer { 0%{left:-100%} 40%{left:150%} 100%{left:150%} }

        .texture-argyle .texture-container::before { background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' width='100' height='100'%3e%3cpath fill='white' d='M50 0L100 50L50 100L0 50z'/%3e%3c/svg%3e"); background-size: 30px 30px; opacity: 0.15; mix-blend-mode: overlay; }
        .texture-argyle .texture-container::after { background: linear-gradient(270deg, transparent, hsla(0,100%,50%,.4), hsla(60,100%,50%,.4), hsla(120,100%,50%,.4), hsla(180,100%,50%,.4), hsla(240,100%,50%,.4), transparent); background-size: 400% 100%; mix-blend-mode: color-dodge; animation: sheen-sweep 4s ease-in-out infinite alternate; }
        @keyframes sheen-sweep { 0%{background-position:150% 0} 100%{background-position:-150% 0} }
    </style>
</head>
<body>
    <h1>The Interactive Showcase</h1>
    <div id="card-display-area"></div>
    <script>
        const LAYOUT_BLUEPRINTS = {
            chase: { artWindow:{x:40, y:55, width:670, height:940}, name:{x:175, y:800, width:400, height:70}, cardNumber:{x:450, y:880, width:150, height:40}, rarityStars:{x:100, y:885, width:200, height:40} }
        };
        const CHASE_CARDS_DATA = [ /* Truncated for brevity */
            { id: "GS-C1", name: "Lunachu", rarity: "Chase", img: "https://i.imgur.com/tT854Uh.png" },
            { id: "GS-C2", name: "Royalzard", rarity: "Chase", img: "https://i.imgur.com/itMes1S.png" },
            { id: "GS-C3", name: "Kaleidocat", rarity: "Chase", img: "https://i.imgur.com/hczPhYn.png" },
            { id: "GS-C4", name: "Prunther", rarity: "Chase", img: "https://i.imgur.com/kz1whh2.png" },
            { id: "GS-C5", name: "Kobraiv", rarity: "Chase", img: "https://i.imgur.com/ugpgpi4.png" },
            { id: "GS-C6", name: "Krystuk", rarity: "Chase", img: "https://i.imgur.com/X1cD2Sa.png" }
        ];
        const CHASE_FRAME_URL = "https://i.imgur.com/roL0VJp.png";
        const CARD_BACK_URL = "https://i.imgur.com/mEDyxhU.png";
        const STAR_SVG = `<svg class="star" viewBox="0 0 24 24"><path d="M12 .587l3.668 7.568 8.332 1.151-6.064 5.828 1.48 8.279L12 19.445l-7.416 4.968 1.48-8.279L0 9.306l8.332-1.151z"/></svg>`;
        const RARITY_MAP = { 'Chase':{count:5, color:'rainbow'} }; 

        function createCardElement(cardData) {
            const layout=LAYOUT_BLUEPRINTS.chase; const baseW=750,baseH=1050; const scale=(v,b)=>(v/b)*100+'%';
            const artX=scale(layout.artWindow.x,baseW),artY=scale(layout.artWindow.y,baseH),artW=scale(layout.artWindow.width,baseW),artH=scale(layout.artWindow.height,baseH);

            const cardWrapper=document.createElement('div'); cardWrapper.className='card-wrapper';
            cardWrapper.innerHTML = `
                <div class="card-container">
                    <div class="card-flipper">
                        <div class="card-face">
                            <div class="card-art texture-argyle" style="left:${artX}; top:${artY}; width:${artW}; height:${artH}; background-image: url(${cardData.img});">
                                <div class="texture-container"></div>
                            </div>
                            <div class="card-text-overlay">
                                <div class="card-name-box" style="left:${scale(layout.name.x,baseW)};top:${scale(layout.name.y,baseH)};width:${scale(layout.name.width,baseW)};height:${scale(layout.name.height,baseH)};"><span>${cardData.name}</span></div>
                                <div class="card-number-box" style="left:${scale(layout.cardNumber.x,baseW)};top:${scale(layout.cardNumber.y,baseH)};width:${scale(layout.cardNumber.width,baseW)};height:${scale(layout.cardNumber.height,baseH)};">${cardData.id}</div>
                                <div class="rarity-stars-container" style="left:${scale(layout.rarityStars.x,baseW)};top:${scale(layout.rarityStars.y,baseH)};width:${scale(layout.rarityStars.width,baseW)};height:${scale(layout.rarityStars.height,baseH)};"></div>
                            </div>
                            <img class="card-frame" src="${CHASE_FRAME_URL}" alt="Card Frame">
                        </div>
                        <div class="card-back" style="background-image: url(${CARD_BACK_URL})"></div>
                    </div>
                </div>`;
            
            const starsContainer = cardWrapper.querySelector('.rarity-stars-container');
            for(let i=0;i<RARITY_MAP.Chase.count;i++){const wrap=document.createElement('div');wrap.className='star-wrapper';wrap.innerHTML=STAR_SVG;const starEl=wrap.querySelector('.star');starEl.classList.add(RARITY_MAP.Chase.color);starsContainer.appendChild(wrap);}
            return cardWrapper;
        }

        function initializeTestBench() {
            const displayArea = document.getElementById('card-display-area');
            CHASE_CARDS_DATA.forEach(cardData => {
                 const cardWrapper = createCardElement(cardData);
                 const cardContainer = cardWrapper.querySelector('.card-container');
                 displayArea.appendChild(cardWrapper);
                 
                 cardContainer.addEventListener('click', () => cardContainer.classList.toggle('is-flipped'));
                 cardContainer.addEventListener('mousemove',(e)=>{const r=cardContainer.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top;const ry=((x/r.width)-.5)*30,rx=((y/r.height)-.5)*-30;cardContainer.style.setProperty('--rotateY',`${ry}deg`);cardContainer.style.setProperty('--rotateX',`${rx}deg`);});
                 cardContainer.addEventListener('mouseleave',()=>{cardContainer.style.setProperty('--rotateY','0deg');cardContainer.style.setProperty('--rotateX','0deg')});
                 
                 const nameSpan=cardContainer.querySelector('.card-name-box>span'),sheen=cardContainer.querySelector('.texture-container');
                 if(nameSpan&&sheen){const d=Math.random()*4;nameSpan.style.animationDelay=`${d}s`;sheen.style.animationDelay=`${d}s`;}
            });
        }
        document.addEventListener('DOMContentLoaded', initializeTestBench);
    </script>
</body>
</html>
